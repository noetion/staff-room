[package]
name = "staff-room"
version = "0.1.0"
description = "A local-first staff room for coding agents where the user decides what ships"
authors = ["Jonathan Asare"]
license = "MIT"
edition = "2021"

[lib]
name = "staff_room_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
cpal = "=0.17.3"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
which = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
